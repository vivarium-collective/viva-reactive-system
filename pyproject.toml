[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "pbg-reactive-system"
version = "0.1.0"
description = "Process-bigraph wrapper for Milner-style Bigraphical Reactive Systems, with a worked MAPK signalling example."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Eran Agmon", email = "agmon.eran@gmail.com"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "bigraph-schema>=0.0.60",
    "process-bigraph>=0.0.66",
    "bigraph-viz>=2.0.3",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    "vivarium-workbench",
]

[project.optional-dependencies]
plots = [
    "matplotlib",
    "imageio",
    "bigraph-viz",
]
dev = [
    "pytest",
    "matplotlib",
    "imageio",
    "bigraph-viz",
]

[project.urls]
Homepage = "https://github.com/vivarium-collective/pbg-reactive-system"
Issues = "https://github.com/vivarium-collective/pbg-reactive-system/issues"

[tool.hatch.build.targets.wheel]
packages = ["pbg_reactive_system"]

[tool.uv.sources]
vivarium-workbench = { path = "/Users/eranagmon/code/vivarium-workbench", editable = true }
